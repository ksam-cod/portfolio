# Render Blueprint for MalConnect.
# This workspace already has a free Postgres instance (limit: one).
# Set DATABASE_URL on the web service to that existing database's
# Internal Database URL, plus PGSSL=true and ADMIN_TOKEN.

services:
  - type: web
    name: portfolio-1
    runtime: node
    plan: free
    region: oregon
    buildCommand: yarn
    startCommand: yarn start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PGSSL
        value: 'true'
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
